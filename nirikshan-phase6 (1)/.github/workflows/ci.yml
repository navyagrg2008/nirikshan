name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres: { image: "postgis/postgis:16-3.4", env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: nrk_test }, ports: ["5432:5432"], options: >- --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10 }
      redis: { image: "redis:7-alpine", ports: ["6379:6379"] }
    env:
      TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/nrk_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nirikshan/shared build
      - run: pnpm typecheck
      - run: pnpm --filter @nirikshan/shared test
      - run: pnpm --filter @nirikshan/api test
      - run: pnpm --filter @nirikshan/web build
      - run: pnpm audit --prod --audit-level high
