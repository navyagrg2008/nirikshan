# Reference reverse proxy for production. TLS terminates here. The API is never exposed directly; the web app proxies /api/v1 (BFF).
server {
  listen 443 ssl http2;
  server_name nirikshan.example;
  ssl_certificate     /etc/ssl/nirikshan/fullchain.pem;
  ssl_certificate_key /etc/ssl/nirikshan/privkey.pem;
  client_max_body_size 6m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
    proxy_set_header X-Forwarded-Proto https;
  }
}
server { listen 80; server_name nirikshan.example; return 301 https://$host$request_uri; }
